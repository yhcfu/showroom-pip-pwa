<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#11131a" />
    <meta name="description" content="SHOWROOMの映像だけを表示するレスポンシブプレイヤー" />
    <link rel="icon" href="../icon.svg" type="image/svg+xml" />
    <title>SHOWROOM PiP Player</title>
  </head>
  <body class="player-page">
    <main class="player-stage" aria-label="SHOWROOM動画プレイヤー">
      <div class="player-overlay">
        <a id="back-to-app" class="player-tool" href="../app/">← 履歴</a>
        <p id="status" class="player-status" role="status" aria-live="polite">リンクを確認中…</p>
        <div class="player-tools">
          <button id="share-button" class="player-tool icon-tool" type="button" aria-label="共有URLをコピー" title="共有URLをコピー" hidden>
            <svg class="tool-icon default-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect x="8" y="8" width="11" height="11" rx="2"></rect>
              <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path>
            </svg>
            <svg class="tool-icon success-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="m5 12 4 4L19 6"></path>
            </svg>
            <span id="share-label" class="tool-label">URL</span>
          </button>
          <button id="balance-button" class="player-tool icon-tool" type="button" aria-label="左右の音声バランス" title="左右の音声バランス" aria-expanded="false" aria-controls="balance-panel" hidden>
            <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M4 5v14M20 5v14M4 9h6M14 15h6"></path>
              <circle cx="12" cy="9" r="2"></circle>
              <circle cx="12" cy="15" r="2"></circle>
            </svg>
            <span class="tool-label">L/R</span>
          </button>
          <button id="pip-button" class="player-tool icon-tool" type="button" aria-label="ピクチャーインピクチャー" title="ピクチャーインピクチャー" disabled>
            <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <rect x="12" y="11" width="7" height="6" rx="1"></rect>
            </svg>
            <span class="tool-label">PiP</span>
          </button>
          <button id="fullscreen-button" class="player-tool" type="button">⛶</button>
        </div>
        <div id="balance-panel" class="balance-panel" hidden>
          <label class="sr-only" for="balance">左右の音声バランス</label>
          <span aria-hidden="true">L</span>
          <input id="balance" type="range" min="-1" max="1" step="0.01" value="0" />
          <span aria-hidden="true">R</span>
          <output id="balance-value" for="balance">C</output>
        </div>
      </div>
      <div class="player-frame">
        <video id="video" controls playsinline preload="metadata"></video>
        <div id="empty-state" class="empty-state">
          <span class="pulse"></span>
          <p id="empty-message">配信を確認しています…</p>
        </div>
      </div>
    </main>
    <script type="module" src="/src/player.ts"></script>
  </body>
</html>
