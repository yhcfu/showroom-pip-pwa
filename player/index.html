<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#11131a" />
    <meta name="description" content="SHOWROOMの映像だけを表示するレスポンシブプレイヤー" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <link rel="icon" href="../icon.svg" type="image/svg+xml" />
    <title>SHOWROOM PiP Player</title>
  </head>
  <body class="player-page">
    <main class="player-stage" aria-label="動画プレイヤー">
      <div class="player-overlay">
        <a id="back-to-app" class="player-tool icon-tool player-back" href="../app/" aria-label="履歴へ戻る" title="履歴へ戻る">
          <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="m15 18-6-6 6-6"></path>
          </svg>
          <span class="tool-label">履歴</span>
        </a>
        <p id="status" class="player-status" role="status" aria-live="polite">リンクを確認中…</p>
        <div class="player-tools">
          <button id="screenshot-button" class="player-tool icon-tool" type="button" aria-label="スクリーンショットを保存・コピー" aria-keyshortcuts="S" title="スクリーンショットを保存・コピー (S)" disabled>
            <svg class="tool-icon default-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M4 7h4l1.5-2h5L16 7h4a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"></path>
              <circle cx="12" cy="13" r="3.5"></circle>
            </svg>
            <svg class="tool-icon success-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="m5 12 4 4L19 6"></path>
            </svg>
            <span id="screenshot-label" class="tool-label">撮影</span>
          </button>
          <button id="clip-button" class="player-tool icon-tool" type="button" aria-label="映像をMP4に切り出す" title="映像をMP4に切り出す" aria-expanded="false" aria-controls="clip-panel" hidden>
            <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="6" cy="7" r="3"></circle>
              <circle cx="6" cy="17" r="3"></circle>
              <path d="m8.6 8.5 11.4 7M8.6 15.5 20 8.5"></path>
            </svg>
            <span class="tool-label">切出</span>
          </button>
          <button id="share-button" class="player-tool icon-tool" type="button" aria-label="共有URLをコピー" title="共有URLをコピー" hidden>
            <svg class="tool-icon default-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect x="8" y="8" width="11" height="11" rx="2"></rect>
              <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path>
            </svg>
            <svg class="tool-icon success-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="m5 12 4 4L19 6"></path>
            </svg>
            <span id="share-label" class="tool-label">URL</span>
          </button>
          <button id="balance-button" class="player-tool icon-tool" type="button" aria-label="左右の音声バランス" title="左右の音声バランス" aria-expanded="false" aria-controls="balance-panel" hidden>
            <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M4 5v14M20 5v14M4 9h6M14 15h6"></path>
              <circle cx="12" cy="9" r="2"></circle>
              <circle cx="12" cy="15" r="2"></circle>
            </svg>
            <span class="tool-label">L/R</span>
          </button>
          <button id="pip-button" class="player-tool icon-tool" type="button" aria-label="ピクチャーインピクチャー" title="ピクチャーインピクチャー" aria-pressed="false" disabled>
            <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <rect x="12" y="11" width="7" height="6" rx="1"></rect>
            </svg>
            <span id="pip-label" class="tool-label">PiP</span>
          </button>
          <button id="fullscreen-button" class="player-tool icon-tool" type="button" aria-label="全画面" title="全画面" aria-pressed="false">
            <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"></path>
            </svg>
            <span id="fullscreen-label" class="tool-label">全画面</span>
          </button>
        </div>
        <div id="balance-panel" class="balance-panel" hidden>
          <label class="sr-only" for="balance">左右の音声バランス</label>
          <span aria-hidden="true">L</span>
          <input id="balance" type="range" min="-1" max="1" step="0.01" value="0" />
          <span aria-hidden="true">R</span>
          <output id="balance-value" for="balance">C</output>
        </div>
        <section id="clip-panel" class="clip-panel" aria-label="MP4切り出し" hidden>
          <video id="clip-preview" class="clip-preview" aria-label="切り出し位置のプレビュー" controls playsinline></video>
          <div class="clip-editor">
            <div class="clip-heading">
              <strong>MP4切り出し（最大1分）</strong>
              <span id="clip-duration">0:00・実時間</span>
            </div>
            <div class="clip-time-fields">
              <label id="clip-start-field" class="clip-time-field" for="clip-start-text">
                <span>開始</span>
                <input id="clip-start-text" type="text" inputmode="decimal" value="0:00.000" spellcheck="false" />
              </label>
              <label id="clip-end-field" class="clip-time-field" for="clip-end-text">
                <span>終了</span>
                <input id="clip-end-text" type="text" inputmode="decimal" value="0:00.000" spellcheck="false" />
              </label>
            </div>
            <div class="clip-adjustment">
              <span id="clip-active-label">開始位置を調整</span>
              <button id="clip-frame-back" class="clip-adjust" type="button" aria-label="開始位置を1フレーム戻す">−1f</button>
              <button id="clip-frame-forward" class="clip-adjust" type="button" aria-label="開始位置を1フレーム進める">+1f</button>
              <button id="clip-now" class="clip-adjust" type="button">現在位置</button>
            </div>
            <button id="clip-save" class="clip-save" type="button" disabled>MP4として保存</button>
          </div>
          <div id="clip-timeline" class="clip-timeline">
            <span class="clip-timeline-track" aria-hidden="true"><span id="clip-selection" class="clip-selection"></span></span>
            <input id="clip-start" type="range" min="0" max="0" step="any" value="0" aria-label="切り出し開始位置" />
            <input id="clip-end" type="range" min="0" max="0" step="any" value="0" aria-label="切り出し終了位置" />
          </div>
        </section>
      </div>
      <div class="player-frame">
        <video id="video" controls playsinline preload="metadata" crossorigin="anonymous"></video>
        <div id="local-ts-drop" class="local-ts-drop" aria-hidden="true" hidden>TSファイルを開く</div>
        <div id="empty-state" class="empty-state">
          <span class="pulse"></span>
          <p id="empty-message">配信を確認しています…</p>
        </div>
      </div>
    </main>
    <script type="module" src="/src/player.ts"></script>
  </body>
</html>
