<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#11131a" />
    <meta name="description" content="SHOWROOMを履歴からすぐ開き、スマートフォンではPiP再生できる個人用PWA" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="../icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../icon-180.png" />
    <title>SHOWROOM PiP</title>
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <h1>SHOWROOM <span>PiP</span></h1>
      </header>

      <section class="control-card">
        <section class="room-section" aria-label="ルームを開く">
          <form id="room-form">
            <label class="sr-only" for="room">SHOWROOMのルームURLまたはroom key</label>
            <div class="field-row">
              <input id="room" name="room" inputmode="url" autocomplete="url" placeholder="ルームURL / room key" required />
              <button id="open-room-button" class="primary" type="submit">開く</button>
            </div>
          </form>
        </section>

        <section class="history-section" aria-labelledby="history-heading">
          <div class="section-heading">
            <h2 id="history-heading">履歴</h2>
          </div>
          <div id="room-history" class="room-history">
            <p class="history-empty">まだ履歴はありません。</p>
          </div>
        </section>

        <details class="settings">
          <summary>設定</summary>
          <div class="details-body">
            <form id="hls-form">
              <label class="sr-only" for="hls-url">HLS master URL</label>
              <div class="field-row">
                <input id="hls-url" name="hls-url" inputmode="url" placeholder="HLS master URL" required />
                <button class="secondary" type="submit">開く</button>
              </div>
            </form>
            <section id="install-guide" class="install-guide" hidden>
              <div>
                <strong id="install-title">ホーム画面に追加</strong>
                <p id="install-summary">履歴へすぐ戻れます。</p>
              </div>
              <button id="install-button" class="quiet-button" type="button">手順</button>
              <ol id="install-steps" hidden>
                <li>Safariの共有ボタンを押す</li>
                <li>「ホーム画面に追加」を選ぶ</li>
                <li>右上の「追加」を押す</li>
              </ol>
            </section>
          </div>
        </details>
      </section>

      <p id="status" class="status" role="status" aria-live="polite" hidden></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
